services:
  api:
    build:
      context: .
    container_name: api_for_1c77_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      rabbit_net:
        ipv4_address: ${API_SHARED_IP:-172.30.100.10}

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: api_for_1c77_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      rabbit_net:
        ipv4_address: ${RABBITMQ_SHARED_IP:-172.30.100.20}

volumes:
  rabbitmq_data:

networks:
  rabbit_net:
    driver: default
    ipam:
      config:
        - subnet: ${SHARED_SUBNET:-172.30.100.0/24}
